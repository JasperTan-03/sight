name: sight
channels:
  - conda-forge
  - pytorch
  - defaults
dependencies:
  - python=3.10
  - pip
  - numpy
  - scipy
  - matplotlib
  - pillow
  - pyyaml
  - requests
  - tqdm
  - scikit-image
  - ipywidgets
  - ipykernel
  - pip:
    - torch
    - torchvision
    - torchaudio
    - transformers
    - filelock
    - fire
    - humanize
    - blobfile
    - pyvista
    - open_clip_torch
    - "trimesh[easy]"
    - black
    - clip @ git+https://github.com/openai/CLIP.git
    - -e .

